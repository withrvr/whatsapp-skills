name: Release

# Every pull request merged into main is a release. The PR already bumped the
# version (CI enforces it), so this tags vX.Y.Z on the merge commit and
# publishes the skill zips. Pushes that don't change the version do nothing.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check before releasing
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python scripts/sync.py --check
          python scripts/validate.py
          python -m unittest discover -s tests
      - name: Build skill zips
        if: steps.version.outputs.exists == 'false'
        run: python scripts/build_zips.py --out dist
      - name: Tag and publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk -v v="$VERSION" '$0 ~ "^## "v" " {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md)
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" \
            --notes "${notes:-Release $TAG}" --latest
